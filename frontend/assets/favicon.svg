<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AegisTrace emblem">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="38%" stop-color="#d8dbe6"/>
      <stop offset="52%" stop-color="#9aa1b4"/>
      <stop offset="68%" stop-color="#e7eaf2"/>
      <stop offset="100%" stop-color="#b7bdcd"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9382ff"/>
      <stop offset="100%" stop-color="#5200ff"/>
    </linearGradient>
    <linearGradient id="violetDeep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c13bea"/>
      <stop offset="100%" stop-color="#7b1fd6"/>
    </linearGradient>
  </defs>

  <!-- shield body -->
  <path d="M32 4 L56 13 v22c0 12.2-9.6 21.6-24 25C17.6 56.6 8 47.2 8 35V13L32 4z"
        fill="url(#chrome)" stroke="#2a2b3d" stroke-width="1.2"/>

  <!-- inner shield -->
  <path d="M32 9.5 L50.5 16.4 v18.2c0 9.4-7.1 16.8-18.5 20C21.1 51.4 13.5 44 13.5 34.6V16.4L32 9.5z"
        fill="#14121c" stroke="url(#violet)" stroke-width="1.6"/>

  <!-- eagle head -->
  <path d="M32 16c-4.6 0-8.4 3.5-8.4 8 0 2.7 1.3 4.9 3.3 6.3-3.6-.4-6.6-2.2-8.9-5.1.4 5.4 3.6 9.6 8.3 11.2-1.1 2.6-3.4 4.6-6.2 5.6 3.4 1.6 7 2 10.4 1.3l1.5-.4 1.5.4c3.4.7 7 .3 10.4-1.3-2.8-1-5.1-3-6.2-5.6 4.7-1.6 7.9-5.8 8.3-11.2-2.3 2.9-5.3 4.7-8.9 5.1 2-1.4 3.3-3.6 3.3-6.3 0-4.5-3.8-8-8.4-8z"
        fill="url(#chrome)"/>
  <!-- beak / eye accent -->
  <path d="M26.4 22.6c1.6-1.1 3.7-1.1 5.3 0-.9 2.3-4.4 2.3-5.3 0z" fill="url(#violetDeep)"/>

  <!-- lock body -->
  <rect x="24" y="33" width="16" height="13" rx="2.6" fill="url(#chrome)" stroke="#20222f" stroke-width="1"/>
  <path d="M27.5 33v-3.2a4.5 4.5 0 019 0V33" fill="none" stroke="url(#chrome)" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="32" cy="38.4" r="1.9" fill="#14121c"/>
  <rect x="31.2" y="39.4" width="1.6" height="4" rx="0.8" fill="#14121c"/>

  <!-- circuit wings -->
  <g stroke="url(#violet)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.95">
    <path d="M13 27h6l3-3"/>
    <path d="M11 32h8l4-4"/>
    <path d="M13 37h5l3-3"/>
    <path d="M51 27h-6l-3-3"/>
    <path d="M53 32h-8l-4-4"/>
    <path d="M51 37h-5l-3-3"/>
  </g>
  <g fill="#9382ff">
    <circle cx="11" cy="27" r="1.5"/><circle cx="11" cy="32" r="1.5"/><circle cx="13" cy="37" r="1.5"/>
    <circle cx="53" cy="27" r="1.5"/><circle cx="53" cy="32" r="1.5"/><circle cx="51" cy="37" r="1.5"/>
  </g>
</svg>
