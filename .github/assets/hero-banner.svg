<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090812"/>
      <stop offset="50%" stop-color="#0e0c1a"/>
      <stop offset="100%" stop-color="#06050b"/>
    </linearGradient>

    <radialGradient id="violetGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6d28d9" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090812" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#090812" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f1f5f9"/>
      <stop offset="48%" stop-color="#94a3b8"/>
      <stop offset="52%" stop-color="#cbd5e1"/>
      <stop offset="80%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>

    <linearGradient id="neonViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pattern: Cyber Grid -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#2a2542" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="40" cy="0" r="1.5" fill="#a855f7" fill-opacity="0.25"/>
    </pattern>

    <!-- CSS Animations -->
    <style>
      @keyframes laserScan {
        0% { transform: translateY(-20px); opacity: 0; }
        15% { opacity: 0.85; }
        85% { opacity: 0.85; }
        100% { transform: translateY(460px); opacity: 0; }
      }
      @keyframes pulseRing {
        0% { transform: scale(0.95); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 0.2; }
        100% { transform: scale(0.95); opacity: 0.8; }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 400; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blinker {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .laser-line {
        animation: laserScan 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .circuit-flow {
        stroke-dasharray: 8 6;
        animation: dashFlow 12s linear infinite;
      }
      .live-dot {
        animation: blinker 1.8s ease-in-out infinite;
      }
      .glow-pulse {
        transform-origin: 80px 100px;
        animation: pulseRing 4s ease-in-out infinite;
      }
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', 'Helvetica Neue', sans-serif;
      }
      .font-mono {
        font-family: 'JetBrains Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="440" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="440" rx="16" fill="url(#cyberGrid)"/>
  <rect width="1200" height="440" rx="16" fill="url(#violetGlow)"/>
  <rect width="1200" height="440" rx="16" fill="url(#cyanGlow)"/>

  <!-- Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="437" rx="15" fill="none" stroke="#3b3558" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Scanning Laser Line -->
  <g class="laser-line">
    <line x1="10" y1="0" x2="1190" y2="0" stroke="url(#neonViolet)" stroke-width="1.8" filter="url(#laserGlow)"/>
    <line x1="10" y1="0" x2="1190" y2="0" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  </g>

  <!-- Animated Circuit Tracks -->
  <g class="circuit-flow" fill="none" stroke="url(#neonViolet)" stroke-width="1.5" opacity="0.45">
    <path d="M 60 70 L 220 70 L 260 110 L 400 110"/>
    <path d="M 60 370 L 240 370 L 290 320 L 520 320"/>
    <path d="M 750 60 L 900 60 L 950 110 L 1140 110"/>
    <path d="M 820 380 L 980 380 L 1020 340 L 1140 340"/>
  </g>

  <!-- Top Status Bar -->
  <g transform="translate(48, 42)">
    <!-- Pill 1: Live Swarm -->
    <g>
      <rect x="0" y="0" width="168" height="28" rx="14" fill="#18152b" stroke="#4c3d75" stroke-width="1.2"/>
      <circle cx="14" cy="14" r="4.5" fill="#10b981" class="live-dot"/>
      <text x="26" y="18" fill="#34d399" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">SWARM ACTIVE</text>
    </g>

    <!-- Pill 2: 7 Agents -->
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="175" height="28" rx="14" fill="#18152b" stroke="#4c3d75" stroke-width="1.2"/>
      <text x="14" y="18" fill="#c084fc" font-size="11" font-weight="700" letter-spacing="0.8" class="font-mono">7 AUTONOMOUS AGENTS</text>
    </g>

    <!-- Pill 3: Precision Metric -->
    <g transform="translate(367, 0)">
      <rect x="0" y="0" width="160" height="28" rx="14" fill="#18152b" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.6"/>
      <text x="14" y="18" fill="#22d3ee" font-size="11" font-weight="700" letter-spacing="0.8" class="font-mono">0.00% FALSE POSITIVES</text>
    </g>

    <!-- Pill 4: Mutation Trapper -->
    <g transform="translate(539, 0)">
      <rect x="0" y="0" width="195" height="28" rx="14" fill="#18152b" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5"/>
      <text x="14" y="18" fill="#e9d5ff" font-size="11" font-weight="600" letter-spacing="0.6" class="font-mono">SHA-256 MUTATION TRAP</text>
    </g>
  </g>

  <!-- Radar Reticle (Top Right Decorative) -->
  <g opacity="0.55">
    <circle cx="1070" cy="85" r="45" fill="none" stroke="#4c3d75" stroke-width="1"/>
    <circle cx="1070" cy="85" r="30" fill="none" stroke="#3b315b" stroke-width="1" stroke-dasharray="3 3"/>
    <circle cx="1070" cy="85" r="15" fill="none" stroke="#6d28d9" stroke-width="1"/>
    <line x1="1070" y1="35" x2="1070" y2="135" stroke="#3b315b" stroke-width="0.8"/>
    <line x1="1020" y1="85" x2="1120" y2="85" stroke="#3b315b" stroke-width="0.8"/>
    <!-- Radar Sweep Hand -->
    <g style="transform-origin: 1070px 85px; animation: radarSweep 6s linear infinite;">
      <line x1="1070" y1="85" x2="1115" y2="85" stroke="url(#neonCyan)" stroke-width="2" filter="url(#softGlow)"/>
      <polygon points="1070,85 1115,70 1115,85" fill="#06b6d4" opacity="0.18"/>
    </g>
  </g>

  <!-- Center-Left Shield Emblem (Animated Glow) -->
  <g transform="translate(90, 115)">
    <!-- Expanding Pulse Rings -->
    <circle cx="80" cy="100" r="82" fill="none" stroke="#8b5cf6" stroke-width="1.5" class="glow-pulse" opacity="0.4"/>
    <circle cx="80" cy="100" r="95" fill="none" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4 4" class="glow-pulse" opacity="0.3"/>

    <!-- Emblem Container Hex Background -->
    <polygon points="80,10 155,50 155,145 80,188 5,145 5,50" fill="#131122" stroke="url(#neonViolet)" stroke-width="2" filter="url(#softGlow)"/>

    <!-- Exact AegisTrace Shield Vector Scaled -->
    <g transform="translate(32, 40) scale(1.5)">
      <!-- Outer Shield Body -->
      <path d="M32 4 L56 13 v22c0 12.2-9.6 21.6-24 25C17.6 56.6 8 47.2 8 35V13L32 4z"
            fill="url(#chromeGrad)" stroke="#2a2b3d" stroke-width="1.2"/>

      <!-- Inner Shield -->
      <path d="M32 9.5 L50.5 16.4 v18.2c0 9.4-7.1 16.8-18.5 20C21.1 51.4 13.5 44 13.5 34.6V16.4L32 9.5z"
            fill="#12101c" stroke="url(#neonViolet)" stroke-width="1.6"/>

      <!-- Eagle Head -->
      <path d="M32 16c-4.6 0-8.4 3.5-8.4 8 0 2.7 1.3 4.9 3.3 6.3-3.6-.4-6.6-2.2-8.9-5.1.4 5.4 3.6 9.6 8.3 11.2-1.1 2.6-3.4 4.6-6.2 5.6 3.4 1.6 7 2 10.4 1.3l1.5-.4 1.5.4c3.4.7 7 .3 10.4-1.3-2.8-1-5.1-3-6.2-5.6 4.7-1.6 7.9-5.8 8.3-11.2-2.3 2.9-5.3 4.7-8.9 5.1 2-1.4 3.3-3.6 3.3-6.3 0-4.5-3.8-8-8.4-8z"
            fill="url(#chromeGrad)"/>

      <!-- Beak / Eye Accent -->
      <path d="M26.4 22.6c1.6-1.1 3.7-1.1 5.3 0-.9 2.3-4.4 2.3-5.3 0z" fill="#9333ea"/>

      <!-- Lock Body -->
      <rect x="24" y="33" width="16" height="13" rx="2.6" fill="url(#chromeGrad)" stroke="#20222f" stroke-width="1"/>
      <path d="M27.5 33v-3.2a4.5 4.5 0 019 0V33" fill="none" stroke="url(#chromeGrad)" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="32" cy="38.4" r="1.9" fill="#14121c"/>
      <rect x="31.2" y="39.4" width="1.6" height="4" rx="0.8" fill="#14121c"/>

      <!-- Circuit Wings -->
      <g stroke="url(#neonViolet)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.95">
        <path d="M13 27h6l3-3"/>
        <path d="M11 32h8l4-4"/>
        <path d="M13 37h5l3-3"/>
        <path d="M51 27h-6l-3-3"/>
        <path d="M53 32h-8l-4-4"/>
        <path d="M51 37h-5l-3-3"/>
      </g>
      <g fill="#c084fc">
        <circle cx="11" cy="27" r="1.5"/><circle cx="11" cy="32" r="1.5"/><circle cx="13" cy="37" r="1.5"/>
        <circle cx="53" cy="27" r="1.5"/><circle cx="53" cy="32" r="1.5"/><circle cx="51" cy="37" r="1.5"/>
      </g>
    </g>
  </g>

  <!-- Typography & Core Value Prop -->
  <g transform="translate(300, 130)">
    <!-- Brand Title -->
    <text x="0" y="52" fill="url(#chromeGrad)" font-size="56" font-weight="900" letter-spacing="3" class="font-sans" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.8))">AEGISTRACE</text>
    <text x="360" y="24" fill="#a855f7" font-size="14" font-weight="800" letter-spacing="1.5" class="font-mono">v2.0 ENTERPRISE</text>

    <!-- Subtitle -->
    <text x="2" y="88" fill="#f8fafc" font-size="20" font-weight="600" letter-spacing="0.5" class="font-sans">
      Autonomous AI Security Intelligence &amp; Verified Remediation Swarm
    </text>

    <!-- Description Paragraph -->
    <text x="2" y="118" fill="#94a3b8" font-size="14" font-weight="400" class="font-sans">
      Continuous AST Code Comprehension • Cryptographic State Mutation Trapping • Deterministic Patch Synthesis
    </text>

    <!-- Micro Pipeline Nodes (Visual Architecture Line) -->
    <g transform="translate(0, 142)">
      <!-- Line -->
      <line x1="20" y1="28" x2="810" y2="28" stroke="#332c52" stroke-width="2"/>
      <line x1="20" y1="28" x2="680" y2="28" stroke="url(#neonViolet)" stroke-width="2" stroke-dasharray="6 4" class="circuit-flow"/>

      <!-- Node 1: ScopeGate -->
      <g transform="translate(10, 8)">
        <rect x="0" y="0" width="105" height="40" rx="8" fill="#151324" stroke="#6d28d9" stroke-width="1.2"/>
        <text x="12" y="18" fill="#a78bfa" font-size="10" font-weight="700" class="font-mono">01. ORCHESTRATE</text>
        <text x="12" y="31" fill="#cbd5e1" font-size="9" class="font-sans">ScopeGate &amp; DAG</text>
      </g>

      <!-- Node 2: AST Parser -->
      <g transform="translate(128, 8)">
        <rect x="0" y="0" width="105" height="40" rx="8" fill="#151324" stroke="#4f46e5" stroke-width="1.2"/>
        <text x="12" y="18" fill="#818cf8" font-size="10" font-weight="700" class="font-mono">02. AST INTEL</text>
        <text x="12" y="31" fill="#cbd5e1" font-size="9" class="font-sans">Invariant Derivation</text>
      </g>

      <!-- Node 3: Recon Surface -->
      <g transform="translate(246, 8)">
        <rect x="0" y="0" width="105" height="40" rx="8" fill="#151324" stroke="#0891b2" stroke-width="1.2"/>
        <text x="12" y="18" fill="#22d3ee" font-size="10" font-weight="700" class="font-mono">03. RECON MAP</text>
        <text x="12" y="31" fill="#cbd5e1" font-size="9" class="font-sans">OpenAPI 3.0 Surface</text>
      </g>

      <!-- Node 4: Dynamic Mutation Trapper -->
      <g transform="translate(364, 8)">
        <rect x="0" y="0" width="118" height="40" rx="8" fill="#1a142e" stroke="#c084fc" stroke-width="1.5" filter="url(#softGlow)"/>
        <text x="10" y="18" fill="#e879f9" font-size="10" font-weight="700" class="font-mono">04-05. TRAPPER</text>
        <text x="10" y="31" fill="#ffffff" font-size="9" font-weight="600" class="font-sans">SHA-256 DB Diff</text>
      </g>

      <!-- Node 5: Verification (3x) -->
      <g transform="translate(495, 8)">
        <rect x="0" y="0" width="110" height="40" rx="8" fill="#151324" stroke="#d97706" stroke-width="1.2"/>
        <text x="12" y="18" fill="#fbbf24" font-size="10" font-weight="700" class="font-mono">06. VERIFY 3X</text>
        <text x="12" y="31" fill="#cbd5e1" font-size="9" class="font-sans">Sandbox Arbitration</text>
      </g>

      <!-- Node 6: AST Remediation -->
      <g transform="translate(618, 8)">
        <rect x="0" y="0" width="115" height="40" rx="8" fill="#151324" stroke="#059669" stroke-width="1.4"/>
        <text x="12" y="18" fill="#34d399" font-size="10" font-weight="700" class="font-mono">07. AST REMEDY</text>
        <text x="12" y="31" fill="#cbd5e1" font-size="9" class="font-sans">Pytest Validated</text>
      </g>

      <!-- Gate: Human Signer -->
      <g transform="translate(746, 8)">
        <rect x="0" y="0" width="95" height="40" rx="8" fill="#1e1832" stroke="#e11d48" stroke-width="1.2"/>
        <text x="10" y="18" fill="#fb7185" font-size="10" font-weight="700" class="font-mono">GATE</text>
        <text x="10" y="31" fill="#fecdd3" font-size="9" class="font-sans">Human Merge</text>
      </g>
    </g>
  </g>

  <!-- Bottom Metric Badges Row -->
  <g transform="translate(50, 368)">
    <!-- Box 1 -->
    <g>
      <rect x="0" y="0" width="250" height="46" rx="8" fill="#110f1e" stroke="#2e274a" stroke-width="1"/>
      <text x="18" y="22" fill="#94a3b8" font-size="11" class="font-sans">PRECISION ON BENCHMARK</text>
      <text x="18" y="38" fill="#10b981" font-size="14" font-weight="800" class="font-mono">100.0% (0 False Positives)</text>
    </g>

    <!-- Box 2 -->
    <g transform="translate(265, 0)">
      <rect x="0" y="0" width="265" height="46" rx="8" fill="#110f1e" stroke="#2e274a" stroke-width="1"/>
      <text x="18" y="22" fill="#94a3b8" font-size="11" class="font-sans">REPRODUCTION FIDELITY</text>
      <text x="18" y="38" fill="#22d3ee" font-size="14" font-weight="800" class="font-mono">3/3 Deterministic Replay</text>
    </g>

    <!-- Box 3 -->
    <g transform="translate(545, 0)">
      <rect x="0" y="0" width="265" height="46" rx="8" fill="#110f1e" stroke="#2e274a" stroke-width="1"/>
      <text x="18" y="22" fill="#94a3b8" font-size="11" class="font-sans">EVIDENCE INTEGRITY</text>
      <text x="18" y="38" fill="#c084fc" font-size="14" font-weight="800" class="font-mono">SHA-256 DB Diff Hash</text>
    </g>

    <!-- Box 4 -->
    <g transform="translate(825, 0)">
      <rect x="0" y="0" width="275" height="46" rx="8" fill="#110f1e" stroke="#2e274a" stroke-width="1"/>
      <text x="18" y="22" fill="#94a3b8" font-size="11" class="font-sans">INFERENCE ACCELERATOR</text>
      <text x="18" y="38" fill="#fbbf24" font-size="14" font-weight="800" class="font-mono">Groq LLaMA 3.3 70B &amp; GPT-OSS</text>
    </g>
  </g>
</svg>